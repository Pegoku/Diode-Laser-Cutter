  data_pin: gpio.21
  ws_pin: gpio.17
spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18
sdcard:
  cs_pin: gpio.0
  card_detect_pin: NO_PIN
  frequency_hz: 8000000
i2c0:
  sda_pin: gpio.27
  scl_pin: gpio.26
status_outputs:
  report_interval_ms: 500
  idle_pin: I2SO.11:low
  run_pin: I2SO.14:low
  alarm_pin: I2SO.3:low
Laser:
  output_pin: gpio.13:pd
  s0_with_disable: false
  disable_with_s0: false
  speed_map: 0=0.000% 1000=100.000%
  enable_pin: NO_PIN
start:
  must_home: false